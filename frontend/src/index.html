<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Our private memories together">
  <title>Our Story</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Preconnect for faster media loading -->
  <link rel="preconnect" href="/media">
</head>
<body>
  <div id="app">
    <!-- Login Page -->
    <div id="login-page" class="page hidden">
      <div class="login-container">
        <h1>Our Story</h1>
        <p class="login-subtitle">Enter to view our memories</p>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Enter</button>
          <p id="login-error" class="error-message hidden"></p>
        </form>
      </div>
    </div>

    <!-- Main Timeline Page -->
    <div id="timeline-page" class="page hidden">
      <!-- Hero Section -->
      <header id="hero" class="hero">
        <div class="hero-content">
          <h1 id="hero-title">Our Story</h1>
          <p id="hero-subtitle" class="hero-subtitle"></p>
          <div class="hero-stats">
            <div class="stat" id="days-together-stat">
              <span class="stat-value" id="days-together">-</span>
              <span class="stat-label">days together</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="memory-count">0</span>
              <span class="stat-label">memories</span>
            </div>
          </div>
        </div>
        <div class="scroll-indicator">
          <span>Scroll to explore</span>
          <div class="scroll-arrow"></div>
        </div>
      </header>

      <!-- Timeline -->
      <main id="timeline" class="timeline">
        <!-- Memories will be rendered here -->
      </main>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <h2>No memories yet</h2>
        <p>Start capturing your moments together</p>
        <button id="add-first-memory" class="btn btn-primary">Add Your First Memory</button>
      </div>

      <!-- Navigation -->
      <nav class="nav-bar">
        <button id="nav-upload" class="nav-btn" title="Add Memory">
          <span class="nav-icon">+</span>
        </button>
        <button id="nav-logout" class="nav-btn" title="Logout">
          <span class="nav-icon">⎋</span>
        </button>
      </nav>
    </div>

    <!-- Upload Page -->
    <div id="upload-page" class="page hidden">
      <header class="upload-header">
        <button id="upload-back" class="btn btn-icon">←</button>
        <h1>Add Memory</h1>
      </header>
      <form id="upload-form" class="upload-form">
        <div class="upload-preview" id="upload-preview">
          <span>Click or drag to add photo/video</span>
          <input type="file" id="upload-file" name="file" accept="image/jpeg,image/png,video/mp4,video/quicktime" required>
        </div>
        <div class="form-group">
          <label for="upload-date">Date</label>
          <input type="date" id="upload-date" name="date" required>
        </div>
        <div class="form-group">
          <label for="upload-caption">Caption (optional)</label>
          <textarea id="upload-caption" name="caption" rows="3" maxlength="2000" placeholder="What makes this memory special?"></textarea>
        </div>
        <div id="upload-progress" class="upload-progress hidden">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="progress-text" id="progress-text">Uploading...</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Memory</button>
        <p id="upload-error" class="error-message hidden"></p>
      </form>
    </div>

    <!-- Media Viewer Modal -->
    <div id="viewer-modal" class="viewer-modal hidden">
      <button id="viewer-close" class="viewer-close">×</button>
      <button id="viewer-prev" class="viewer-nav viewer-prev">‹</button>
      <button id="viewer-next" class="viewer-nav viewer-next">›</button>
      <div class="viewer-content">
        <img id="viewer-image" class="viewer-media hidden" alt="">
        <video id="viewer-video" class="viewer-media hidden" controls></video>
      </div>
      <div class="viewer-info">
        <p id="viewer-date" class="viewer-date"></p>
        <p id="viewer-caption" class="viewer-caption"></p>
      </div>
    </div>
  </div>

  <!-- Dynamic Background -->
  <div id="background" class="dynamic-background"></div>

  <!-- Scripts (ES6 modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
